name: Trigger Lima Python Build Workflow

on:
  workflow_run:
    workflows:
      - "Build the manylinux_2_28-based image with LIMA compiled with Qt6 installed workflow"
    types:
      - completed

jobs:
  trigger_remote_workflow:
    runs-on: ubuntu-latest
    # Only when the LIMA images were pushed: a successful push build (master or
    # a release tag; pull request builds are not pushed) or a manual run on
    # master
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.event == 'push'
              || (github.event.workflow_run.event == 'workflow_dispatch'
                  && github.event.workflow_run.head_branch == 'master')) }}
    steps:
      - name: Trigger Remote Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.TRIGGER_LIMA_PYTHON }}
          repository: aymara/lima-python
          event-type: "trigger_workflow"
          # release: a release tag build (pushes run on master and tags only)
          # or a manual run. lima-python then also builds its Windows and macOS
          # wheels, on the packages that build-win.yml and build-macos.yml
          # publish for a release.
          client-payload: >-
            {"release": ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'master')
                            || github.event.workflow_run.event == 'workflow_dispatch' }}}
