name: "Build the manylinux_2_28-based image with LIMA compiled with Qt6 installed workflow"
# The Linux wheels of aymara/lima-python are built on these images: they are
# built on every push to master and release tag (v<x.y.z>), and validated on
# pull requests. A successful push build triggers aymara/lima-python's build
# (trigger-lima-python-on-success.yml).
on:
  push:
    branches:
    - master
    tags:
    - '[0-9]*.[0-9]*.[0-9]*'
    - 'v*'
  pull_request:
    branches:
    - master
  # Allow rebuilding the costly base images on demand (e.g. after changing one
  # of their Dockerfiles). Set "force_base_images" to true to rebuild them all
  # even if no Dockerfile changed.
  workflow_dispatch:
    inputs:
      force_base_images:
        description: "Rebuild all base images even if unchanged"
        type: boolean
        default: false

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # The Boost image (built once, on manylinux_2_28, reused by both chains)
  MANYLINUX_TAG: "2022-10-25-fbea779"
  # svmtool++ does not use Qt: its image, built elsewhere for Qt 6.5, is reused
  SVMTOOLPP_IMAGE: "aymara/svmtoolpp-manylinux2.28-qt6.5:latest"
  PYSIDE_VERSION: "6"
  LLVM_VERSION: "13.0.1"
  # The Qt, Python and manylinux versions of the two chains are in the
  # matrix of the jobs below (MATRIX)


jobs:

  # Detect which costly base-image Dockerfiles changed so we only rebuild the
  # ones that actually need it: since the previous push (push to master), the
  # base branch (pull request) or the previous release, the last v* tag before
  # this commit (tag, manual run). The boolean outputs gate the base-image jobs
  # below; "force_base_images" (workflow_dispatch) overrides them all.
  changes:
    name: "Detect changed base-image Dockerfiles"
    runs-on: ubuntu-latest
    outputs:
      boost: ${{ steps.filter.outputs.boost }}
      qt6: ${{ steps.filter.outputs.qt6 }}
      pyside: ${{ steps.filter.outputs.pyside }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # the history and the tags, to find the previous release

      # Without a base (no previous release tag, new branch), nothing is
      # considered changed: the base images exist (:latest); use
      # force_base_images to rebuild them.
      - name: "Changed base-image files"
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_TYPE}" = branch ]; then
            if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi
          else
            if [ "${GITHUB_REF_TYPE}" = tag ]; then from=HEAD^; else from=HEAD; fi
            base=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --match 'v*' "$from" 2>/dev/null || true)
          fi
          if [ -n "$base" ]; then
            echo "Compared with: $base"
            changed=$(git diff --name-only "$base" HEAD)
          else
            echo "::notice::No base to compare with: base images not rebuilt (use force_base_images)"
            changed=""
          fi
          check() {  # <output> <regexp of the files>
            if grep -qxE "$2" <<< "$changed"; then echo "$1=true"; else echo "$1=false"; fi | tee -a "$GITHUB_OUTPUT"
          }
          check boost 'continuous_integration/Dockerfile-manylinux_2_28_with_boost'
          # The Qt and Python versions are set in this workflow
          check qt6 'continuous_integration/Dockerfile-manylinux_2_28_with_qt6|\.github/workflows/build-qt6\.yml'
          check pyside 'continuous_integration/Dockerfile-manylinux_2_28_with_qt_and_pyside|\.github/workflows/build-qt6\.yml'


  manylinux_2_28_with_boost:
    name: "Build the manylinux_2_28-based image with Boost"
    needs: changes
    # Only rebuild when its Dockerfile changed, or when forced manually.
    if: ${{ needs.changes.outputs.boost == 'true' || github.event.inputs.force_base_images == 'true' }}
    runs-on: ubuntu-latest

    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Build image"
        run: cd ./continuous_integration && docker build -f Dockerfile-manylinux_2_28_with_boost --build-arg MANYLINUX_TAG="${MANYLINUX_TAG}" -t aymara/manylinux_2_28_with_boost:latest .

      - name: "Push image"
        run: docker push aymara/manylinux_2_28_with_boost:latest


  manylinux_2_28_with_qt6:
    name: "Build the ${{ matrix.manylinux }} image with Qt 6.${{ matrix.qt_minor }}"
    needs: changes
    if: ${{ needs.changes.outputs.qt6 == 'true' || github.event.inputs.force_base_images == 'true' }}
    runs-on: ubuntu-latest
    # Two chains, from the same sources, for aymara's two Linux wheels:
    # manylinux_2_28 + Qt 6.9.3 (Python 3.9-3.13, glibc >= 2.28; Qt 6.9 is the
    # last whose PySide6 wheels are manylinux_2_28) and manylinux_2_34 + Qt
    # 6.12 (Python 3.10-3.15, glibc >= 2.34); the abi3 wheel built with the
    # oldest Python of each works with all its Pythons
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: manylinux_2_28
            manylinux_tag: "2022-10-25-fbea779"
            python: "3.9"
            python_short: "cp39-cp39"
            python_wheel: "cp39-abi3"
            python_full: "3.9.15"      # the one of the manylinux_tag image
            qt_minor: "9"
            qt_patch: "3"
            gcc_version: "11.2.1"
            gcc_toolset: "11"
          - manylinux: manylinux_2_34
            manylinux_tag: "2026.11.14-1"
            python: "3.10"
            python_short: "cp310-cp310"
            python_wheel: "cp310-abi3"
            python_full: "3.10.22"     # the one of the manylinux_tag image
            qt_minor: "12"
            qt_patch: "0"
            gcc_version: "14.2.1"
            gcc_toolset: "14"
    env:
      MANYLINUX: ${{ matrix.manylinux }}
      MANYLINUX_TAG: ${{ matrix.manylinux_tag }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_SHORT_VERSION: ${{ matrix.python_short }}
      PYTHON_WHEEL_VERSION: ${{ matrix.python_wheel }}
      PYTHON_FULL_VERSION: ${{ matrix.python_full }}
      QT_VERSION_MAJOR: "6"
      QT_VERSION_MINOR: ${{ matrix.qt_minor }}
      QT_VERSION_PATCH: ${{ matrix.qt_patch }}
      QT_VERSION: "6.${{ matrix.qt_minor }}"
      QT_FULL_VERSION: "6.${{ matrix.qt_minor }}.${{ matrix.qt_patch }}"
      GCC_VERSION: ${{ matrix.gcc_version }}
      GCC_TOOLSET: ${{ matrix.gcc_toolset }}

    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Build image"
        run: cd ./continuous_integration && docker build -f Dockerfile-manylinux_2_28_with_qt6 --build-arg MANYLINUX="${MANYLINUX}" --build-arg MANYLINUX_TAG="${MANYLINUX_TAG}" --build-arg GCC_VERSION="${GCC_VERSION}" --build-arg LLVM_VERSION="${LLVM_VERSION}" --build-arg QT_FULL_VERSION="${QT_FULL_VERSION}" --build-arg QT_VERSION_MAJOR="${QT_VERSION_MAJOR}" --build-arg QT_VERSION_MINOR="${QT_VERSION_MINOR}" --build-arg QT_VERSION_PATCH="${QT_VERSION_PATCH}" --build-arg QT_VERSION="${QT_VERSION}" --build-arg PYTHON_VERSION=${PYTHON_VERSION} --build-arg PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION} --build-arg PYTHON_FULL_VERSION=${PYTHON_FULL_VERSION} -t aymara/${MANYLINUX}_with_qt${QT_VERSION}:latest .

      - name: "Push image"
        run: docker push aymara/${MANYLINUX}_with_qt${QT_VERSION}:latest


  manylinux_2_28_with_qt_and_pyside:
    name: "Build the ${{ matrix.manylinux }} Qt 6.${{ matrix.qt_minor }} and PySide image (Python ${{ matrix.python }})"
    needs: [changes, manylinux_2_28_with_qt6]
    # Rebuild when its own Dockerfile changed, when qt6 was rebuilt (it is
    # FROM-based on it), or when forced. Runs even if qt6 was skipped, as long
    # as qt6 did not fail.
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.changes.outputs.pyside == 'true' || needs.manylinux_2_28_with_qt6.result == 'success' || github.event.inputs.force_base_images == 'true') }}
    runs-on: ubuntu-latest
    # Two chains, from the same sources, for aymara's two Linux wheels:
    # manylinux_2_28 + Qt 6.9.3 (Python 3.9-3.13, glibc >= 2.28; Qt 6.9 is the
    # last whose PySide6 wheels are manylinux_2_28) and manylinux_2_34 + Qt
    # 6.12 (Python 3.10-3.15, glibc >= 2.34); the abi3 wheel built with the
    # oldest Python of each works with all its Pythons
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: manylinux_2_28
            manylinux_tag: "2022-10-25-fbea779"
            python: "3.9"
            python_short: "cp39-cp39"
            python_wheel: "cp39-abi3"
            python_full: "3.9.15"      # the one of the manylinux_tag image
            qt_minor: "9"
            qt_patch: "3"
            gcc_version: "11.2.1"
            gcc_toolset: "11"
          - manylinux: manylinux_2_34
            manylinux_tag: "2026.11.14-1"
            python: "3.10"
            python_short: "cp310-cp310"
            python_wheel: "cp310-abi3"
            python_full: "3.10.22"     # the one of the manylinux_tag image
            qt_minor: "12"
            qt_patch: "0"
            gcc_version: "14.2.1"
            gcc_toolset: "14"
    env:
      MANYLINUX: ${{ matrix.manylinux }}
      MANYLINUX_TAG: ${{ matrix.manylinux_tag }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_SHORT_VERSION: ${{ matrix.python_short }}
      PYTHON_WHEEL_VERSION: ${{ matrix.python_wheel }}
      PYTHON_FULL_VERSION: ${{ matrix.python_full }}
      QT_VERSION_MAJOR: "6"
      QT_VERSION_MINOR: ${{ matrix.qt_minor }}
      QT_VERSION_PATCH: ${{ matrix.qt_patch }}
      QT_VERSION: "6.${{ matrix.qt_minor }}"
      QT_FULL_VERSION: "6.${{ matrix.qt_minor }}.${{ matrix.qt_patch }}"
      GCC_VERSION: ${{ matrix.gcc_version }}
      GCC_TOOLSET: ${{ matrix.gcc_toolset }}

    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Free disk space"
        run: bash ./free-diskspace.sh

      - name: "Build image"
        run: cd ./continuous_integration && docker build --progress=plain -f Dockerfile-manylinux_2_28_with_qt_and_pyside --build-arg MANYLINUX="${MANYLINUX}" --build-arg GCC_TOOLSET="${GCC_TOOLSET}" --build-arg MANYLINUX_TAG="${MANYLINUX_TAG}" --build-arg GCC_VERSION="${GCC_VERSION}" --build-arg LLVM_VERSION="${LLVM_VERSION}" --build-arg QT_FULL_VERSION="${QT_FULL_VERSION}" --build-arg QT_VERSION_MAJOR="${QT_VERSION_MAJOR}" --build-arg QT_VERSION_MINOR="${QT_VERSION_MINOR}" --build-arg QT_VERSION_PATCH="${QT_VERSION_PATCH}" --build-arg QT_VERSION="${QT_VERSION}" --build-arg PYSIDE_VERSION="${PYSIDE_VERSION}" --build-arg PYTHON_VERSION=${PYTHON_VERSION} --build-arg PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION} --build-arg PYTHON_FULL_VERSION=${PYTHON_FULL_VERSION} -t aymara/${MANYLINUX}_with_qt${QT_VERSION}_and_pyside-python${PYTHON_VERSION}:latest .

      - name: "Push image"
        run: docker push aymara/${MANYLINUX}_with_qt${QT_VERSION}_and_pyside-python${PYTHON_VERSION}:latest


  manylinux_2_28_lima-manylinux:
    name: "Build the ${{ matrix.manylinux }} LIMA image (Qt 6.${{ matrix.qt_minor }}, Python ${{ matrix.python }})"
    needs: [changes, manylinux_2_28_with_boost, manylinux_2_28_with_qt6, manylinux_2_28_with_qt_and_pyside]
    # Always build LIMA itself. It pulls the base images as :latest from the
    # registry, so it must run whether or not the base jobs ran (skipped) —
    # but NOT if any base job actually failed.
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    # Two chains, from the same sources, for aymara's two Linux wheels:
    # manylinux_2_28 + Qt 6.9.3 (Python 3.9-3.13, glibc >= 2.28; Qt 6.9 is the
    # last whose PySide6 wheels are manylinux_2_28) and manylinux_2_34 + Qt
    # 6.12 (Python 3.10-3.15, glibc >= 2.34); the abi3 wheel built with the
    # oldest Python of each works with all its Pythons
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: manylinux_2_28
            manylinux_tag: "2022-10-25-fbea779"
            python: "3.9"
            python_short: "cp39-cp39"
            python_wheel: "cp39-abi3"
            python_full: "3.9.15"      # the one of the manylinux_tag image
            qt_minor: "9"
            qt_patch: "3"
            gcc_version: "11.2.1"
            gcc_toolset: "11"
          - manylinux: manylinux_2_34
            manylinux_tag: "2026.11.14-1"
            python: "3.10"
            python_short: "cp310-cp310"
            python_wheel: "cp310-abi3"
            python_full: "3.10.22"     # the one of the manylinux_tag image
            qt_minor: "12"
            qt_patch: "0"
            gcc_version: "14.2.1"
            gcc_toolset: "14"
    env:
      MANYLINUX: ${{ matrix.manylinux }}
      MANYLINUX_TAG: ${{ matrix.manylinux_tag }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_SHORT_VERSION: ${{ matrix.python_short }}
      PYTHON_WHEEL_VERSION: ${{ matrix.python_wheel }}
      PYTHON_FULL_VERSION: ${{ matrix.python_full }}
      QT_VERSION_MAJOR: "6"
      QT_VERSION_MINOR: ${{ matrix.qt_minor }}
      QT_VERSION_PATCH: ${{ matrix.qt_patch }}
      QT_VERSION: "6.${{ matrix.qt_minor }}"
      QT_FULL_VERSION: "6.${{ matrix.qt_minor }}.${{ matrix.qt_patch }}"
      GCC_VERSION: ${{ matrix.gcc_version }}
      GCC_TOOLSET: ${{ matrix.gcc_toolset }}

    steps:
      -
        name: Login to DockerHub
        # Don't log in / push on pull requests: only build to validate.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: "Build image"
        run: cd ./continuous_integration && docker build -f Dockerfile-manylinux_2_28_with_qt6_lima-manylinux --build-arg MANYLINUX="${MANYLINUX}" --build-arg MANYLINUX_TAG="${MANYLINUX_TAG}" --build-arg GCC_VERSION="${GCC_VERSION}" --build-arg LLVM_VERSION="${LLVM_VERSION}" --build-arg QT_FULL_VERSION="${QT_FULL_VERSION}" --build-arg QT_VERSION_MAJOR="${QT_VERSION_MAJOR}" --build-arg QT_VERSION_MINOR="${QT_VERSION_MINOR}" --build-arg QT_VERSION_PATCH="${QT_VERSION_PATCH}" --build-arg QT_VERSION="${QT_VERSION}" --build-arg PYSIDE_VERSION="${PYSIDE_VERSION}" --build-arg PYTHON_VERSION=${PYTHON_VERSION} --build-arg PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION} --build-arg PYTHON_FULL_VERSION=${PYTHON_FULL_VERSION} --build-arg  WITH_LIMA_RESOURCES="ON" --build-arg WITH_LEGACY_PIPELINES="ON" --build-arg SVMTOOLPP_IMAGE="${SVMTOOLPP_IMAGE}" --build-arg BRANCH="${{ github.head_ref || github.ref_name }}" -t aymara/lima-${MANYLINUX}-qt${QT_VERSION}-python${PYTHON_VERSION}:latest .

      - name: "Push image"
        if: github.event_name != 'pull_request'
        run: docker push aymara/lima-${MANYLINUX}-qt${QT_VERSION}-python${PYTHON_VERSION}:latest
