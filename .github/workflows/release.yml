name: "GitHub release"

# The GitHub release of a release tag (x.y.z, made by bumpver): its notes are
# generated by GitHub from the pull requests merged since the previous release
# tag. The Windows and macOS packages are attached to it by build-win.yml and
# build-macos.yml when they are built (they also stay in the "continuous"
# prerelease, used by aymara/lima-python). Also run on demand for an existing
# tag (e.g. a former release without GitHub release): `gh workflow run
# release.yml -f tag=v3.0.1 [-f notes_start_tag=v3.0.0] [-f latest=false]`.
on:
    push:
        tags:
            - '[0-9]*.[0-9]*.[0-9]*'
    workflow_dispatch:
        inputs:
            tag:
                description: "The tag of the release (x.y.z, or a former vx.y.z)"
                required: true
                type: string
            notes_start_tag:
                description: "The tag the notes start from (default: the previous release tag)"
                required: false
                type: string
            latest:
                description: "Mark it as the latest release"
                type: boolean
                default: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "Create the release"
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag || github.ref_name }}
                  START: ${{ inputs.notes_start_tag }}
                  # A pushed tag is the newest release
                  LATEST: ${{ github.event_name == 'push' || inputs.latest }}
              run: |
                  if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      echo "The release $TAG already exists"
                      exit 0
                  fi
                  if [ -z "$START" ]; then
                      # The previous release tag (x.y.z, or vx.y.z up to 3.0.1)
                      START=$(git describe --tags --abbrev=0 \
                          --match '[0-9]*.[0-9]*.[0-9]*' --match 'v[0-9]*.[0-9]*.[0-9]*' \
                          "$TAG^" 2> /dev/null || true)
                  fi
                  args=(--title "LIMA ${TAG#v}" --generate-notes --verify-tag "--latest=$LATEST")
                  if [ -n "$START" ]; then
                      echo "Notes since $START"
                      args+=(--notes-start-tag "$START")
                  fi
                  gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${args[@]}"
